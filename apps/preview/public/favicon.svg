<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="rxova">
  <!-- The three gradient stops are --rx-accent-a/b/c from tokens.css. Starlight's
       shared config points `favicon` at /favicon.svg and resolves it against the
       site's own public/, so it cannot ship from the package. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a84ff" />
      <stop offset="0.5" stop-color="#6b3df0" />
      <stop offset="1" stop-color="#e6199b" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#g)" />
  <circle cx="16" cy="16" r="5.5" fill="none" stroke="#fff" stroke-width="2.5" />
</svg>
