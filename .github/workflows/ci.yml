name: CI

on:
  push:
    branches: [main]
  pull_request:
    # No `edited` (body edits would cancel and re-bill runs; pr-title.yml handles retitles).
    # `labeled`/`unlabeled` re-run the full graph so the `skip-changeset` label takes effect.
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Default to read-only; jobs opt into more where they need it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only pull requests supersede in-flight runs. On main a cancelled CI concludes `cancelled`,
  # which skips that commit's Release (gated on `success`).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The root of the graph: lints the commits and decides what the range touched
  # (`repoConfig.scope`). A release commit or a documentation-only range skips the heavy jobs.
  commitlint:
    uses: rxova/shared/.github/workflows/commit-messages.yml@main

  # Lint, format, actionlint, this repository's own checks (`check:repo`), build and typecheck.
  checks:
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true'
    uses: rxova/shared/.github/workflows/repo-checks.yml@main
    with:
      build-command: pnpm exec turbo run build
      extra-command: pnpm run check:repo

  # The site deploys on one Node and one OS, so the suite runs on those.
  test:
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true'
    uses: rxova/shared/.github/workflows/unit-tests.yml@main
    with:
      node-versions: "[24]"
      operating-systems: '["ubuntu-latest"]'

  supply-chain:
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true'
    uses: rxova/shared/.github/workflows/supply-chain.yml@main

  package-contract:
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true'
    uses: rxova/shared/.github/workflows/package-contract.yml@main

  # Published-package changes need a changeset. Escape hatch: the `skip-changeset` label.
  changeset:
    name: changeset present
    needs: [commitlint]
    uses: rxova/shared/.github/workflows/changeset-gate.yml@main

  e2e:
    name: e2e
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: rxova/shared/actions/setup-pnpm@main
      - uses: rxova/shared/actions/turbo-cache@main
      - run: pnpm install --frozen-lockfile
      - uses: rxova/shared/actions/setup-playwright@main
        with:
          browsers: chromium
          working-directory: apps/e2e
      # Each app against its own preview, then the assembled site as the deploy composes it.
      - name: Run the behaviour specs
        run: pnpm run e2e
      - name: Keep the traces of failed specs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-traces
          path: "**/test-results"
          retention-days: 7

  # The light job a documentation-only range runs instead: formatting.
  docs-checks:
    needs: [commitlint]
    if: needs.commitlint.outputs.docs-only == 'true'
    uses: rxova/shared/.github/workflows/docs-checks.yml@main

  # `all checks` is the one required status: every job passed or was skipped.
  all-checks:
    name: all checks
    if: always()
    needs: [commitlint, checks, test, supply-chain, package-contract, changeset, e2e, docs-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: rxova/shared/actions/require-jobs@main
        with:
          needs: ${{ toJSON(needs) }}
