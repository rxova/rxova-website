name: CI

on:
  push:
    branches: [main]
  # `edited` is here because of what the commitlint job below lints: the PR
  # title and description, which is the message a squash merge composes. Those
  # are the only inputs to a check that no push can change — without `edited`,
  # fixing the title the job just rejected leaves the red X in place and the
  # only way to re-run it is a no-op commit.
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap gate first: a bad commit message fails in seconds and short-circuits
  # the heavier install + static checks below (needs: commitlint).
  commitlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.cjs
          commitDepth: 0

      # The step above lints the branch's commits, but none of them is what
      # lands: a squash merge composes a new message from the PR title and
      # description at merge time. Unlinted, that message's first contact with
      # CI is the push to main, where it can no longer be edited. Lint it here,
      # while it is still a PR field someone can fix.
      #
      # Title and body go through env, never through ${{ }} interpolation into
      # the script — a backtick or $( in a PR title would otherwise execute.
      - name: Lint prospective squash-merge message
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" |
            npx --yes \
              -p @commitlint/cli@21.2.1 \
              -p @commitlint/config-conventional@21.2.0 \
              commitlint --config commitlint.config.cjs

  static:
    name: format · lint · types · test · build
    needs: commitlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      # The registry pipeline: how sources.json becomes a build matrix, where a
      # docs build is found, and what the assembler refuses to publish. These
      # only otherwise run during a deploy, where a mistake is already live.
      - run: pnpm run test
      # Structural check on the real sources.json. The cross-check against
      # @rxova/brand's PROJECTS runs inside `build` below, where Vite can load
      # the package's TypeScript source — see site/src/lib/projects.ts.
      - run: pnpm run check:registry
      - run: pnpm run build
