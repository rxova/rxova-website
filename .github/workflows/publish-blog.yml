name: Publish the blog

# Build /blog and hand it to rxova.org. One file per surface, not a matrix or reusable workflow: the
# aggregator fetches the fixed `docs-dist` artifact by run id, so each surface needs its own run.

on:
  push:
    branches: [main]
    paths:
      - 'apps/blog/**'
      # The surfaces are built against these, so a change to any republishes
      # both. That is one more reason they cannot share a run.
      - 'packages/website-schemas/src/**'
      - 'packages/brand/src/**'
      - 'packages/astro-ui/src/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-blog-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the repository_dispatch that hands the build to ingest.yml
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: ./.github/actions/publish-surface
        with:
          surface: blog
          package: '@rxova/blog'
