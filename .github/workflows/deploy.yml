name: Deploy rxova.org

# Builds the Astro landing + each project's docs, assembles them into one tree,
# and publishes to GitHub Pages. See sources.json and build/PLAN.md.
#
# Adding a project should NOT require editing this file. Which projects exist,
# where they come from, how they build and whether they are enabled all live in
# sources.json; the `matrix` job below turns that into the docs build matrix.
# The only thing that cannot be data-driven is the `on:` block — GitHub does not
# allow expressions there — which is why dispatches use a single `docs` type
# carrying the project name in its payload rather than a type per project.

on:
  repository_dispatch:
    # `docs` is the contract: client_payload { project: "<id>", ref: "<sha>" }.
    # The docs-<id> types are the previous per-project contract, kept so the
    # sibling repos can migrate one at a time. Once all of them send `docs`,
    # these three can be deleted and this list never grows again.
    types: [docs, docs-journey, docs-react-inputs, docs-use-everywhere]
  workflow_dispatch:
    inputs:
      project:
        description: 'Project id to build at a specific ref (blank = all at their default ref)'
        required: false
      ref:
        description: 'Ref for that project (default: its ref in sources.json)'
        required: false
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  DOCS_URL: https://rxova.org

jobs:
  # Resolve sources.json into a build matrix. Runs first and is cheap; a
  # malformed registry or a dispatch naming an unknown project fails here,
  # before any repo is checked out.
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      count: ${{ steps.gen.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: gen
        # Event data goes through env, never through ${{ }} interpolation into a
        # script — a dispatch payload is attacker-shaped input and would
        # otherwise be evaluated as shell.
        env:
          EVENT_ACTION: ${{ github.event.action }}
          CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          INPUT_PROJECT: ${{ github.event.inputs.project }}
          INPUT_REF: ${{ github.event.inputs.ref }}
        run: node scripts/matrix.mjs

  build-landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C site build
      - uses: actions/upload-artifact@v4
        with:
          name: landing
          path: site/dist
          if-no-files-found: error

  # One job per enabled project, generated from sources.json. This replaced three
  # near-identical hand-written jobs that differed only in the values now supplied
  # by the matrix.
  build-docs:
    needs: matrix
    if: needs.matrix.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    name: docs (${{ matrix.id }})
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          path: ${{ matrix.workdir }}
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # No pnpm cache: the project lives in a subdir, so setup-node cannot
          # resolve the store path from this workspace's root.
      - name: Install
        working-directory: ${{ matrix.workdir }}
        run: ${{ matrix.install }}
      - name: Build docs at ${{ matrix.base }}
        working-directory: ${{ matrix.workdir }}
        env:
          DOCS_URL: ${{ env.DOCS_URL }}
          DOCS_BASE_URL: ${{ matrix.base }}
        # From sources.json, which is version-controlled and reviewed in the same
        # PR as this file — same trust boundary, not user input.
        run: ${{ matrix.build }}

      # Docs frameworks disagree about where a build lands: Docusaurus emits
      # `build/`, Astro/Starlight emits `dist/`. sources.json lists candidates
      # rather than one path, so a project can migrate between them without a
      # change here. Resolving it in its own step also means a project that
      # built nothing fails with an explanation instead of upload-artifact's
      # "No files were found with the provided path".
      - name: Locate docs output
        id: docs_output
        working-directory: ${{ matrix.workdir }}
        env:
          PROJECT: ${{ matrix.id }}
          CANDIDATES: ${{ matrix.output }}
        run: |
          resolved=""
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            if [ -d "$dir" ] && [ -n "$(ls -A "$dir" 2>/dev/null)" ]; then
              resolved="$dir"
              break
            fi
            echo "  – $dir: absent or empty"
          done <<< "$CANDIDATES"

          if [ -z "$resolved" ]; then
            echo "::error::No docs output for '$PROJECT'. Tried: $(echo "$CANDIDATES" | tr '\n' ' ')"
            echo "Directories present under apps/docs:"
            ls -la apps/docs 2>/dev/null || echo "  (no apps/docs directory)"
            echo
            echo "If the docs build now lands somewhere else, add \"output\" to this"
            echo "project's entry in sources.json (a string, or a list of candidates)."
            exit 1
          fi

          echo "✓ $PROJECT docs output: $resolved"
          if [ ! -f "$resolved/index.html" ]; then
            echo "::warning::$resolved has no index.html at its root — ${{ matrix.base }} may 404."
          fi
          echo "dir=$resolved" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.workdir }}/${{ steps.docs_output.outputs.dir }}
          if-no-files-found: error

  assemble-deploy:
    needs: [matrix, build-landing, build-docs]
    # Only the landing is required. build-docs is skipped when sources.json has
    # nothing enabled, which is a landing-only deploy and fine. A *failed* docs
    # build is not fine and blocks the deploy — assemble.mjs would refuse anyway,
    # since an enabled project with no artifact means a section silently missing
    # from the site.
    if: >-
      always() &&
      needs.build-landing.result == 'success' &&
      (needs.build-docs.result == 'success' || needs.build-docs.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble _site
        run: node scripts/assemble.mjs artifacts _site
      - name: Add .nojekyll + CNAME
        env:
          CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}
        run: |
          touch _site/.nojekyll
          if [ -n "$CUSTOM_DOMAIN" ]; then
            echo "$CUSTOM_DOMAIN" > _site/CNAME
            echo "Custom domain -> $CUSTOM_DOMAIN"
          else
            echo "No PAGES_CUSTOM_DOMAIN set; serving at the default Pages URL."
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
