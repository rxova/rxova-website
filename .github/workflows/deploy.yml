name: Deploy rxova.org

# Builds the landing, fetches every enabled project's persisted docs (built elsewhere, see ingest.yml),
# assembles one tree and publishes to Pages. Adding a project only needs sources.json, not this file.

on:
  # Called by ingest.yml right after it persists a new dist, so a docs push shows
  # up on the live site without a second dispatch or a token that can re-trigger.
  workflow_call:
  # Manual full redeploy from whatever is currently persisted.
  workflow_dispatch:
  # Landing / site changes in this repo.
  push:
    branches: [main]

permissions:
  contents: read # read the content-<id> releases
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  build-landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Same pinned pnpm + cached setup-node as CI uses, so the two
      # workflows cannot drift to different Node or pnpm versions.
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm install --frozen-lockfile

      - name: Build landing with aggregate analytics
        env:
          PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
        run: pnpm -C apps/landing build
      - uses: actions/upload-artifact@v7
        with:
          name: landing
          path: apps/landing/dist
          if-no-files-found: error

  assemble-deploy:
    needs: build-landing
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # The scripts below import @rxova/website-schemas, so this job needs the workspace
      # installed, not a bare setup-node.
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm install --frozen-lockfile

      - name: Download the landing build
        uses: actions/download-artifact@v8
        with:
          name: landing
          path: artifacts/landing

      # Pulls each enabled project's content-<id> release into artifacts/docs-<id>, where
      # assemble reads it; a missing release fails here, naming the project.
      - name: Gather persisted docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node packages/tooling/src/deploy/fetch-docs.ts artifacts

      - name: Assemble _site
        run: node packages/tooling/src/deploy/assemble.ts artifacts _site

      - name: Add .nojekyll + CNAME
        env:
          CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}
        run: |
          touch _site/.nojekyll
          if [ -n "$CUSTOM_DOMAIN" ]; then
            echo "$CUSTOM_DOMAIN" > _site/CNAME
            echo "Custom domain -> $CUSTOM_DOMAIN"
          else
            echo "No PAGES_CUSTOM_DOMAIN set; serving at the default Pages URL."
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
