name: Deploy rxova.org

# Builds this repo's Astro landing, gathers every enabled project's docs from its
# content release, assembles them into one tree, and publishes to GitHub Pages.
#
# Nothing foreign is built here. Docs are built by their own repos and sent here
# already built, then validated and persisted as release assets by ingest.yml (see
# that workflow and docs/INPUTS-CONTRACT.md). This workflow only ever moves
# already-built trees: it fetches each project's persisted dist and lays it out.
#
# Adding a project should NOT require editing this file. Which projects exist and
# whether they are enabled live in sources.json; scripts/fetch-docs.mjs turns that
# into the set of release assets to download.

on:
  # Called by ingest.yml right after it persists a new dist, so a docs push shows
  # up on the live site without a second dispatch or a token that can re-trigger.
  workflow_call:
  # Manual full redeploy from whatever is currently persisted.
  workflow_dispatch:
  # Landing / site changes in this repo.
  push:
    branches: [main]
  # Called by ingest-content.yml once it has persisted new prose, the same way
  # ingest.yml calls this for docs.

permissions:
  contents: read # read the content-<id> releases
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  build-landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Same corepack + pinned pnpm + cached setup-node as CI uses, so the two
      # workflows cannot drift to different Node or pnpm versions.
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm install --frozen-lockfile

      # The prose and the schema that validates it, out of this repo's own
      # content-prose release — written by ingest-content.yml from the artifact
      # rxova/brand uploads. `gh` uses the built-in token; no cross-repo access.
      #
      # A missing release fails here, naming what to re-run, rather than building a
      # site with no blog. See docs/CONTENT-ARCHITECTURE.md.
      - name: Fetch the content
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/fetch-content.mjs

      - run: pnpm -C site build
      - uses: actions/upload-artifact@v7
        with:
          name: landing
          path: site/dist
          if-no-files-found: error

  assemble-deploy:
    needs: build-landing
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download the landing build
        uses: actions/download-artifact@v8
        with:
          name: landing
          path: artifacts/landing

      # Every enabled project's persisted docs, pulled from its content-<id>
      # release into artifacts/docs-<id> — exactly where assemble.mjs reads them.
      # A missing release fails here, naming the project, rather than silently
      # publishing a site with a hole in it.
      - name: Gather persisted docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/fetch-docs.mjs artifacts

      - name: Assemble _site
        run: node scripts/assemble.mjs artifacts _site

      - name: Add .nojekyll + CNAME
        env:
          CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}
        run: |
          touch _site/.nojekyll
          if [ -n "$CUSTOM_DOMAIN" ]; then
            echo "$CUSTOM_DOMAIN" > _site/CNAME
            echo "Custom domain -> $CUSTOM_DOMAIN"
          else
            echo "No PAGES_CUSTOM_DOMAIN set; serving at the default Pages URL."
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
