name: Ingest docs

# Gate 2 of the docs pipeline (docs/INPUTS-CONTRACT.md): validates a `docs` dispatch and its dist,
# persists the dist as a release asset and redeploys; gates live in packages/tooling/src/deploy/ingest.ts.

on:
  repository_dispatch:
    # client_payload: { schema, project, ref, sha, run_id, base?, framework? }
    types: [docs]

permissions:
  contents: write # create / update the content-<id> release
  actions: read # read the source repo's run to download its dist
  pages: write
  id-token: write

# One ingest per project at a time; different projects ingest in parallel. The
# project name only forms a concurrency-group string here — it is never evaluated.
concurrency: ingest-${{ github.event.client_payload.project }}

jobs:
  ingest:
    runs-on: ubuntu-latest
    outputs:
      # Whether the project is mounted. The docs are validated and persisted either
      # way; this only gates the deploy below.
      enabled: ${{ steps.validate.outputs.enabled }}
    steps:
      - uses: actions/checkout@v7
      # Not a bare setup-node: ingest.ts imports @rxova/website-schemas, so the workspace
      # has to be installed.
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile

      # Gate 2a. Event data goes through env, never ${{ }} interpolation: the payload is
      # attacker-shaped input.
      - id: validate
        name: Validate dispatch (gate 2a)
        env:
          CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: node packages/tooling/src/deploy/ingest.ts

      # Cross-repo download needs SOURCE_ARTIFACTS_TOKEN with actions:read on the source repo;
      # surfaces built in this repo use the job's own token.
      - name: Download the sender's dist
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.validate.outputs.artifact_name }}
          repository: ${{ steps.validate.outputs.repo }}
          run-id: ${{ steps.validate.outputs.run_id }}
          github-token: ${{ steps.validate.outputs.repo == github.repository && github.token || secrets.SOURCE_ARTIFACTS_TOKEN }}
          path: incoming

      # Gate 2b. Only now, with the tree on disk, is it trusted.
      - name: Validate dist (gate 2b)
        env:
          EXPECTED_SCHEMA: ${{ steps.validate.outputs.schema }}
          EXPECTED_PROJECT: ${{ steps.validate.outputs.project }}
          EXPECTED_BASE: ${{ steps.validate.outputs.base }}
        run: node packages/tooling/src/deploy/ingest.ts --check-dist incoming

      # Persist as the project's canonical asset. Replace the asset in place if the
      # release exists, create the release the first time a project is ingested.
      - name: Persist ${{ steps.validate.outputs.release_asset }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.validate.outputs.release_tag }}
          ASSET: ${{ steps.validate.outputs.release_asset }}
          PROJECT: ${{ steps.validate.outputs.project }}
          REF: ${{ steps.validate.outputs.ref }}
          SHA: ${{ steps.validate.outputs.sha }}
          FRAMEWORK: ${{ steps.validate.outputs.framework }}
          SOURCE_REPO: ${{ steps.validate.outputs.repo }}
          RUN_ID: ${{ steps.validate.outputs.run_id }}
        run: |
          set -euo pipefail
          tar -czf "$ASSET" -C incoming .
          notes=$(printf 'project: %s\nref: %s\nsha: %s\nframework: %s\nsource run: %s/%s/actions/runs/%s\ningested by: %s/%s/actions/runs/%s' \
            "$PROJECT" "$REF" "$SHA" "$FRAMEWORK" \
            "$GITHUB_SERVER_URL" "$SOURCE_REPO" "$RUN_ID" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
            gh release edit "$TAG" --notes "$notes"
          else
            gh release create "$TAG" "$ASSET" --title "Docs content: $PROJECT" --notes "$notes"
          fi

  # Redeploys in the same run, so no token that can re-trigger workflows is needed. Only for
  # mounted projects; disabled ones are still validated and persisted above.
  deploy:
    needs: ingest
    if: needs.ingest.outputs.enabled == 'true'
    uses: ./.github/workflows/deploy.yml
