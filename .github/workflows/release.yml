name: Release

# Runs after CI goes green on main: opens the `chore: version packages` pull request, and
# publishes with npm trusted publishing once that is merged.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    # workflow_run fires on failure as well, so the conclusion is checked.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    # The version commit and tags, the version pull request, and npm trusted publishing (OIDC).
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: rxova/shared/.github/workflows/changesets-release.yml@main
