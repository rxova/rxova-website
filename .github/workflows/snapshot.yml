name: Snapshot

# Publishes an immutable prerelease under a dist-tag (never `latest`) to try an in-progress
# change in another repository: `pnpm add @rxova/<package>@next`.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "dist-tag to publish under"
        required: false
        default: "next"

permissions:
  contents: read

jobs:
  snapshot:
    permissions:
      contents: read
      id-token: write # trusted publishing
    uses: rxova/shared/.github/workflows/snapshot-release.yml@main
    with:
      tag: ${{ inputs.tag }}
