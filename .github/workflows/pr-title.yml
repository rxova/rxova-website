name: PR title

# The squash or rebase subject can be retitled after CI went green, so the title is checked on
# every edit here, under a name nothing requires.

on:
  pull_request:
    types: [opened, edited, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: commit message (PR title)
    # `changes.title` is only present when the edit touched the title.
    if: github.event.action != 'edited' || github.event.changes.title
    uses: rxova/shared/.github/workflows/lint-pr-title.yml@main
