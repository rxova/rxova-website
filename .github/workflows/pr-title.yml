name: PR title

# Re-checks the squash-merge subject (the PR title) on every edit. Separate from CI because `edited`
# also fires on body edits, and its own concurrency group means a retitle never cancels CI.

on:
  pull_request:
    types: [opened, edited, reopened]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: commit message (PR title)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile

      # Passed through the environment, never interpolated into the shell — a
      # title is attacker-controlled text.
      - name: Lint the PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | pnpm exec commitlint --verbose
