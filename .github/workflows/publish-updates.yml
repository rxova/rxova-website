name: Publish updates

# Build /updates and hand it to rxova.org. A separate file from publish-blog.yml so it gets its own
# run and `docs-dist` artifact (reasoning in publish-blog.yml; steps in ../actions/publish-surface).

on:
  push:
    branches: [main]
    paths:
      - 'apps/updates/**'
      # The surfaces are built against these, so a change to any republishes
      # both. That is one more reason they cannot share a run.
      - 'packages/website-schemas/src/**'
      - 'packages/brand/src/**'
      - 'packages/astro-ui/src/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-updates-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the repository_dispatch that hands the build to ingest.yml
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: ./.github/actions/publish-surface
        with:
          surface: updates
          package: '@rxova/updates'
