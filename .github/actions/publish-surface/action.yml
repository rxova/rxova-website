name: Publish a site surface
description: Build one surface for its mount, upload its dist, and tell rxova.org it is there.

# A surface's publish body. An action, not a reusable workflow or matrix, so each surface
# gets its own workflow run as the aggregator requires (see publish-blog.yml, docs/INPUTS-CONTRACT.md).

inputs:
  surface:
    description: The surface to build — its package directory, its mount, and its project id.
    required: true
  package:
    description: The workspace package name to build, e.g. '@rxova/blog'.
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      run: pnpm install --frozen-lockfile

    # The same gate CI runs; CI runs on the merge commit in parallel, so check here too.
    - shell: bash
      run: pnpm run validate:content

    # Built for the mount, never `/`: the aggregator doesn't rewrite asset paths. Through turbo, not
    # `pnpm --filter`, so `^build` builds @rxova/website-schemas' dist/ first.
    - name: Build ${{ inputs.surface }}
      shell: bash
      env:
        DOCS_BASE_URL: /${{ inputs.surface }}/
      run: pnpm exec turbo run build --filter=${{ inputs.package }}

    # Nothing upstream notices a wrong base (`/` is valid, just not this one), so assert it here.
    - name: Check it was built for its mount
      shell: bash
      run: node packages/tooling/src/deploy/check-base.ts
        apps/${{ inputs.surface }}/dist /${{ inputs.surface }}/

    - name: Mark the page-component bundle
      shell: bash
      run: node packages/tooling/src/deploy/write-page-bundle.ts
        apps/${{ inputs.surface }}/dist ${{ inputs.surface }} /${{ inputs.surface }}/

    - name: Read the version
      id: meta
      shell: bash
      run: |
        VERSION=$(node -p "require('./apps/${{ inputs.surface }}/package.json').version")
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    # The fixed name the aggregator downloads by; do not rename it. Only one artifact per run
    # may carry it (see publish-blog.yml).
    - uses: actions/upload-artifact@v7
      with:
        name: docs-dist
        path: apps/${{ inputs.surface }}/dist
        if-no-files-found: error

    # A `repository_dispatch` with GITHUB_TOKEN may start the in-repo ingest workflow;
    # the calling job grants `contents: write` for it.
    - name: Tell rxova.org
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh api "repos/${GITHUB_REPOSITORY}/dispatches" \
          -f event_type=docs \
          -F client_payload[schema]=2 \
          -F client_payload[project]='${{ inputs.surface }}' \
          -F client_payload[ref]="${GITHUB_REF#refs/heads/}" \
          -F client_payload[sha]="$GITHUB_SHA" \
          -F client_payload[run_id]="$GITHUB_RUN_ID" \
          -F client_payload[version]='${{ steps.meta.outputs.version }}' \
          -F client_payload[base]='/${{ inputs.surface }}/' \
          -F client_payload[framework]=astro
