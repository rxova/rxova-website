name: Turbo cache
description: Restore and save Turborepo's local .turbo cache across CI runs.

# Caches Turbo's task cache per job and OS. Never add it to a Node-version matrix job: every leg
# shares `github.job`, so one leg could replay results computed under another Node.
runs:
  using: composite
  steps:
    - uses: actions/cache@v6
      with:
        path: .turbo
        key: turbo-${{ github.job }}-${{ runner.os }}-${{ github.sha }}
        restore-keys: turbo-${{ github.job }}-${{ runner.os }}-
