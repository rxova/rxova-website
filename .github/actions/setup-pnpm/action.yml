name: Setup pnpm
description: Install pnpm (version from the packageManager field) and Node.js with pnpm caching.

# Installs the pnpm version pinned in `packageManager`, caching the install in `~/setup-pnpm` so a
# registry outage can't stall every job; the cache is a probed fast path, never a requirement.

inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: '24'
  registry-url:
    description: >-
      npm registry to configure auth against. Only the publishing jobs need
      this — it is what writes the .npmrc that Trusted Publishing authenticates
      with.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # The cache key names the `packageManager` version, with any `+<integrity>` suffix stripped.
    - name: Read the pnpm version
      id: pnpm-version
      shell: bash
      run: |
        version=$(node -p "
          const pm = require('./package.json').packageManager ?? '';
          pm.startsWith('pnpm@') ? pm.slice('pnpm@'.length).split('+')[0] : ''
        ")
        if [ -z "$version" ]; then
          echo "::warning::no pnpm version in packageManager; skipping the install cache"
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    # Windows stays on the ordinary path: a bash-style path in $GITHUB_PATH doesn't resolve
    # for the non-bash steps that follow.
    - name: Decide whether the install can be cached
      id: cacheable
      shell: bash
      run: |
        if [ -n "${{ steps.pnpm-version.outputs.version }}" ] && [ "$RUNNER_OS" != "Windows" ]; then
          echo 'yes=true' >> "$GITHUB_OUTPUT"
        else
          echo 'yes=false' >> "$GITHUB_OUTPUT"
        fi

    - name: Restore the pnpm install
      if: steps.cacheable.outputs.yes == 'true'
      uses: actions/cache@v6
      with:
        path: ~/setup-pnpm
        key: setup-pnpm-${{ runner.os }}-${{ steps.pnpm-version.outputs.version }}

    # Used only if it runs and reports the wanted version, so a bad restore costs one
    # ordinary install instead of a failure further down.
    - name: Probe the restored install
      id: restored
      if: steps.cacheable.outputs.yes == 'true'
      shell: bash
      env:
        WANT: ${{ steps.pnpm-version.outputs.version }}
      run: |
        home="$HOME/setup-pnpm/node_modules/.bin"
        usable=false
        # self-update leaves the bootstrap in PNPM_HOME and the requested version in
        # PNPM_HOME/bin; either may report the right version, so try both.
        for candidate in "$home/bin/pnpm" "$home/pnpm"; do
          if [ -x "$candidate" ] && [ "$("$candidate" --version 2>/dev/null)" = "$WANT" ]; then
            usable=true
            break
          fi
        done
        echo "usable=$usable" >> "$GITHUB_OUTPUT"
        if [ "$usable" = true ]; then
          echo "restored pnpm $WANT from cache"
        fi

    # Mirrors pnpm/action-setup's PATH order; $GITHUB_PATH prepends, so `bin` (where
    # self-update put the requested version) ends up first.
    - name: Use the restored install
      if: steps.restored.outputs.usable == 'true'
      shell: bash
      run: |
        home="$HOME/setup-pnpm/node_modules/.bin"
        echo "PNPM_HOME=$home" >> "$GITHUB_ENV"
        echo "$home" >> "$GITHUB_PATH"
        echo "$home/bin" >> "$GITHUB_PATH"

    # The ordinary path on a cache miss. npm honours these env vars, capping registry
    # waits at ~40s instead of the default 2 retries x 5 minutes.
    - name: Setup pnpm
      if: steps.restored.outputs.usable != 'true'
      uses: pnpm/action-setup@v6
      env:
        npm_config_fetch_timeout: '20000'
        npm_config_fetch_retries: '1'
        npm_config_fetch_retry_mintimeout: '5000'
        npm_config_fetch_retry_maxtimeout: '10000'

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}
        cache-dependency-path: pnpm-lock.yaml
        cache: pnpm

    # Asserted, not just reported: the fast path resolves pnpm itself, and running a different
    # pnpm than `packageManager` pins would surface as something else later.
    - name: Report versions
      shell: bash
      env:
        WANT: ${{ steps.pnpm-version.outputs.version }}
      run: |
        node --version
        pnpm --version
        if [ -n "$WANT" ] && [ "$(pnpm --version)" != "$WANT" ]; then
          echo "::error::pnpm $(pnpm --version) is on PATH but packageManager pins $WANT"
          exit 1
        fi
